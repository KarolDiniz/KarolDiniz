name: generate snake

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: generate lilac snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c4b5fd&color_dots=#1a0f2e,#2d1b4e,#7c3aed,#8b5cf6,#a78bfa
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#1a0f2e,#2d1b4e,#7c3aed,#8b5cf6,#a78bfa

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
